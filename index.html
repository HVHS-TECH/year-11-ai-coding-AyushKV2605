<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
#game-container {
  text-align: center;
  width: 100%;
  max-width: 520px;
}
canvas {
  width: 100%;
  max-width: 400px;
  background: #111;
  border: 4px solid #444;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
  display: block;
  margin: 0 auto 1rem;
}
#info {
  display: grid;
  gap: 0.75rem;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
#info span {
  background: #1e1e1e;
  padding: 0.75rem 1rem;
  border-radius: 0.75rem;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
}
</style>
</head>
<body>
<div id="game-container">
  <h1>Snake Game</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="info">
    <span id="score">Score: 0</span>
    <span id="speed">Speed: 6</span>
    <span id="status">Use arrow keys to move</span>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
